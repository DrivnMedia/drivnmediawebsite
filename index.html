<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drivn Media - Down for Maintenance</title>
  <meta name="description" content="Drivn Media is down for maintenance while we work on something new." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#08080a" />
  <link rel="icon" href="/favicon.ico" />

  <style>
    /* Brand tokens carried over from assets/css/styles.css */
    :root {
      --bg: #08080a;
      --bg-elev: #0e0e12;
      --line: rgba(255, 255, 255, 0.09);
      --text: #f4f5f7;
      --text-soft: #b9bcc4;
      --text-mute: #80838d;
      --accent: #2882fd;
      --accent-2: #3ee2fe;
      --accent-glow: rgba(40, 130, 253, 0.42);
      --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
      --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 17px;
      line-height: 1.65;
      letter-spacing: 0.1px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      /* Soft brand-blue glow behind the card, on the deep gloss black */
      background-image:
        radial-gradient(60% 45% at 50% 0%, var(--accent-glow) 0%, rgba(40, 130, 253, 0) 70%),
        radial-gradient(40% 35% at 85% 100%, rgba(62, 226, 254, 0.14) 0%, rgba(62, 226, 254, 0) 70%);
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    main {
      width: 100%;
      max-width: 620px;
      text-align: center;
      padding: 48px 32px 44px;
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 26px;
      box-shadow: 0 30px 80px -40px rgba(0, 0, 0, 0.9);
    }

    .logo {
      display: block;
      width: 220px;
      max-width: 70%;
      height: auto;
      margin: 0 auto 36px;
    }

    .divider {
      width: 56px;
      height: 3px;
      margin: 0 auto 28px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }

    h1 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(30px, 5.5vw, 42px);
      line-height: 1.12;
      letter-spacing: -0.5px;
      margin: 0 0 16px;
    }

    p {
      margin: 0;
      color: var(--text-soft);
      font-size: 17.5px;
    }

    .contact {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      color: var(--text-mute);
      font-size: 16px;
    }

    .contact a {
      color: var(--accent-2);
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px solid rgba(62, 226, 254, 0.35);
    }
    .contact a:hover { border-bottom-color: var(--accent-2); }

    @media (max-width: 480px) {
      main { padding: 36px 22px 32px; border-radius: 20px; }
      .logo { margin-bottom: 28px; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="assets/img/drivn-logo.png" alt="Drivn Media" width="1122" height="335" />
    <div class="divider" aria-hidden="true"></div>
    <h1>We're making some big changes.</h1>
    <p>The site is down for maintenance while we work on something new.</p>
    <p class="contact">Need to reach us? <a href="mailto:dominic@drivnmedia.info">dominic@drivnmedia.info</a></p>
  </main>
</body>
</html>
